<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">School programming projects</title>
  <desc id="desc">A code editor preview beside a tic-tac-toe game board, representing Thomas Xiao's Python games and utilities.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="34" y="26" width="330" height="48" rx="24" fill="#e7efff"/>
  <text x="55" y="59" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123b7a">Python games &amp; utilities</text>
  <rect x="55" y="110" width="700" height="505" rx="22" fill="#172033"/>
  <circle cx="88" cy="142" r="8" fill="#ff6b6b"/>
  <circle cx="115" cy="142" r="8" fill="#ffd166"/>
  <circle cx="142" cy="142" r="8" fill="#57cc99"/>
  <text x="177" y="151" font-family="SFMono-Regular, Menlo, monospace" font-size="23" fill="#a8b3cf">tictactoe.py</text>
  <g font-family="SFMono-Regular, Menlo, monospace" font-size="23">
    <text x="85" y="208" fill="#ff8fab">def</text><text x="132" y="208" fill="#82aaff"> computer_move</text><text x="326" y="208" fill="#d8dee9">(board, smart):</text>
    <text x="110" y="250" fill="#d8dee9">available_moves = [i </text><text x="383" y="250" fill="#ff8fab">for</text><text x="426" y="250" fill="#d8dee9"> i, cell </text>
    <text x="110" y="290" fill="#ff8fab">if</text><text x="140" y="290" fill="#d8dee9"> cell.isdigit()]</text>
    <text x="110" y="348" fill="#ff8fab">def</text><text x="157" y="348" fill="#82aaff"> minimax</text><text x="270" y="348" fill="#d8dee9">(board, depth, is_maximizing):</text>
    <text x="135" y="390" fill="#ff8fab">if</text><text x="165" y="390" fill="#d8dee9"> is_winner(board, </text><text x="398" y="390" fill="#c3e88d">"O"</text><text x="438" y="390" fill="#d8dee9">):</text>
    <text x="160" y="432" fill="#ff8fab">return</text><text x="243" y="432" fill="#f78c6c"> 10</text><text x="281" y="432" fill="#d8dee9"> - depth</text>
    <text x="135" y="474" fill="#ff8fab">if</text><text x="165" y="474" fill="#d8dee9"> is_full(board):</text>
    <text x="160" y="516" fill="#ff8fab">return</text><text x="243" y="516" fill="#f78c6c"> 0</text>
    <text x="85" y="574" fill="#6f7d9b"># also includes slide puzzle, hangman, Mario &amp; ciphers</text>
  </g>
  <rect x="810" y="145" width="330" height="420" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="4"/>
  <text x="975" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Tic-Tac-Toe</text>
  <g stroke="#315f9b" stroke-width="7" stroke-linecap="round">
    <line x1="920" y1="250" x2="920" y2="470"/><line x1="1030" y1="250" x2="1030" y2="470"/>
    <line x1="865" y1="323" x2="1085" y2="323"/><line x1="865" y1="397" x2="1085" y2="397"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="865" y="286" fill="#fb6f92">X</text><text x="975" y="286" fill="#315f9b">O</text><text x="1085" y="286" fill="#fb6f92">X</text>
    <text x="865" y="360" fill="#315f9b">O</text><text x="975" y="360" fill="#fb6f92">X</text><text x="1085" y="360" fill="#315f9b">O</text>
    <text x="865" y="434" fill="#fb6f92">X</text><text x="975" y="434" fill="#315f9b">O</text><text x="1085" y="434" fill="#fb6f92">X</text>
  </g>
  <text x="975" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#52627a">Minimax-powered opponent</text>
</svg>
