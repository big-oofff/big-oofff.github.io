name: Build and deploy portfolio

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Prepare current resume
        run: |
          base64 --decode public/Thomas-Xiao-Resume.pdf.b64 > public/Thomas-Xiao-Resume.pdf
          rm public/Thomas-Xiao-Resume.pdf.b64
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          cname: thomasxiao.org
